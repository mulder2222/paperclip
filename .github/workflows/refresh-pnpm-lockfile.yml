name: Refresh pnpm lockfile

on:
  push:
    branches:
      - fix/coolify-lockfile-opencode-timeout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pnpm-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/coolify-lockfile-opencode-timeout
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Refresh lockfile from workspace manifests
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push origin HEAD:fix/coolify-lockfile-opencode-timeout
